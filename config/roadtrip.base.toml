# Hand-maintained recompiler overrides for Road Trip (USA) SLUS-20398.
# Merged on top of ps2_analyzer output by `scripts/pipeline.py analyze` into config/roadtrip.toml.
# See scripts/merge_config.py for merge rules.

[general]
ghidra_output = ""          # set to e.g. "analysis/ghidra/roadtrip_functions.csv" once exported
single_file_output = false
output_worker_threads = 0
patch_syscalls = false
patch_cop0 = true
patch_cache = true

# Extra stubs: "name@0xADDR" bound to a runtime handler, or ret0/ret1/reta0@0xADDR.
stubs = []
# Functions to emit as TODO wrappers instead of recompiling.
skip = []
# Additional entry points (e.g. function-pointer targets found while debugging).
# The game's own libm functions that used to be host stubs (see drop_stubs): recompiled so the
# game's maths runs the game's code (docs/recompiler-accuracy.md).
entry_points = [
  "cos@0x00274810",
  "floor@0x00277340",
  "fabs@0x00277308",
  "__ieee754_rem_pio2f@0x002752C8",
  "__kernel_cosf@0x002767C8",
  "__kernel_sinf@0x002771E0",
  # SetVifFillDirect: only ever reached by function pointer (oracle trace
  # 0x21a088 -> 0x221788 -> 0x225988 -> 0x2212c8), so the analyzer never sees a jal to it.
  "SetVifFillDirect@0x002212C8",
]

# Names to remove from the analyzer's suggestions.
drop_stubs = [
  "sceVu0ApplyMatrix",
  "sceVu0MulMatrix",
  "sceVu0InnerProduct",
  "sceVu0Normalize",
  "sceVu0TransposeMatrix",
  "sceVu0InversMatrix",
  "sceVu0DivVector",
  "sceVu0DivVectorXYZ",
  "sceVu0InterVector",
  "sceVu0TransMatrix",
  "sceVu0CopyMatrix",
  "sceVu0UnitMatrix",
  "sceVu0RotMatrixZ",
  "sceVu0RotMatrixX",
  "sceVu0RotMatrixY",
  "sceVu0RotMatrix",
  "sceVu0ClampVector",
  "sceVu0CameraMatrix",
  "sceVu0NormalLightMatrix",
  "sceVu0LightColorMatrix",
  "sceVu0ViewScreenMatrix",
  "sceVu0DropShadowMatrix",
  "sceVu0RotTransPersN",
  "sceVu0RotTransPers",
  "sceVu0InterVectorXYZ",
  "sceVu0ClipScreen",
  "sceVu0ClipScreen3",
  "sceVu0ClipAll",
  # Internal helper of the RotMatrix family: returns cos/sin in VU0 registers (vf4/vf5), which a
  # C stub cannot do; stubbing it made every rotation matrix garbage (cars invisible and frozen).
  "_sceVu0ecossin",
  # libsdr's EE side: the real SDRDRV.IRX runs on the emulated IOP, so the game's own RPC client
  # reaches it. The runtime stubs dropped sceSdSetParam (Sound Volume) and sceSdSetEffectAttr (reverb).
  "sceSdRemoteInit",
  "sceSdRemote",
  # newlib's libm, which the game's sinf/cosf (recompiled) call. The host stubs read the argument
  # from $f12 as a float, but cos/floor/fabs take a soft-float double in a GPR, and the stubs for
  # __kernel_sinf / __kernel_cosf / __ieee754_rem_pio2f computed sinf(x + y) and a float-only
  # reduction (x - n * pi/2 in single precision): sinf and cosf differed from the game's by up to
  # an ulp or more, so every rotation matrix did. The game's own code is exact by construction.
  "cos",
  "floor",
  "fabs",
  "__ieee754_rem_pio2f",
  "__kernel_cosf",
  "__kernel_sinf",
]
drop_entry_points = []

